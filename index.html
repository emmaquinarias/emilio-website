
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMILIO ARIAS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body {
  width:100%; height:100%; overflow:hidden;
  background:#000; cursor:crosshair;
}
canvas { display:block; width:100%; height:100%; }
#identity {
  position:fixed; top:0; right:0; z-index:10;
  padding:15px 19px;
  background:#fff; color:#000;
  font:700 13px Helvetica,Arial,sans-serif;
  letter-spacing:-.5px;
  user-select:none;
}
#status {
  position:fixed; left:20px; bottom:18px; z-index:10;
  color:rgba(255,255,255,.45);
  font:9px Helvetica,Arial,sans-serif;
  letter-spacing:1.5px;
  pointer-events:none;
}
</style>
</head>
<body>

<div id="identity">EMILIO ARIAS</div>
<div id="status">MOVE TO SHAPE THE SURFACE · CLICK TO DISTURB</div>
<canvas id="visual"></canvas>

<script>
(() => {
"use strict";

const canvas = document.getElementById("visual");
const gl = canvas.getContext("webgl", {
  alpha:false,
  antialias:true,
  depth:true,
  powerPreference:"high-performance"
});

if (!gl) {
  document.body.innerHTML =
    "<p style='color:white;padding:30px'>WebGL is not supported.</p>";
  return;
}

// --------------------------------------------------
// MESH RESOLUTION
// --------------------------------------------------

// A single connected mesh. The grid is concentrated
// around the cursor by changing vertex positions.
// No extra lines are created by clicks.

const COLS = 340;
const ROWS = 240;
const VERTEX_COUNT = (COLS + 1) * (ROWS + 1);

const positions = new Float32Array(VERTEX_COUNT * 2);
const indices = new Uint32Array(
  ROWS * (COLS + 1) * 2 +
  COLS * (ROWS + 1) * 2
);

let indexOffset = 0;

for (let y=0; y<=ROWS; y++) {
  for (let x=0; x<=COLS; x++) {
    const i = y*(COLS+1)+x;

    // Horizontal mesh edges.
    if (x<COLS) {
      indices[indexOffset++] = i;
      indices[indexOffset++] = i+1;
    }

    // Vertical mesh edges.
    if (y<ROWS) {
      indices[indexOffset++] = i;
      indices[indexOffset++] = i+COLS+1;
    }
  }
}

// --------------------------------------------------
// VERTEX SHADER
// --------------------------------------------------

const vertexSource = `
precision highp float;

attribute vec2 gridPosition;

uniform vec2 resolution;
uniform float time;
uniform vec2 mouse;
uniform vec4 clickEvents[4];

varying float surfaceDepth;

float hash3(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.1));
  p *= 17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}

float noise3(vec3 p) {
  vec3 i=floor(p);
  vec3 f=fract(p);
  f=f*f*(3.0-2.0*f);

  return mix(
    mix(
      mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),
      mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),
      f.y
    ),
    mix(
      mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),
      mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),
      f.y
    ),
    f.z
  );
}

float fbm(vec3 p) {
  float result=0.0;
  float amplitude=0.5;

  for(int i=0;i<5;i++) {
    result += noise3(p)*amplitude;
    p = p*2.03 + vec3(13.1,7.7,9.2);
    amplitude *= 0.5;
  }

  return result;
}

void main() {
  float t=time;

  vec2 p=gridPosition;

  // Aspect correction.
  p.x *= resolution.x/resolution.y;

  float radius=length(p);
  float angle=atan(p.y,p.x);

  // ------------------------------------------------
  // LARGE DOME
  // ------------------------------------------------

  float domeRadius=length(vec2(p.x*0.78,p.y*1.1));

  float dome=exp(-domeRadius*domeRadius*2.4);

  // The dome is the base geometry.
  float height=dome*0.30;

  // ------------------------------------------------
  // CENTRAL HORIZON
  // ------------------------------------------------

  float horizon =
      sin(p.x*2.2+t*0.12)*0.009
    + sin(p.x*5.0-t*0.2)*0.004;

  float horizonDistance=abs(p.y-horizon);

  float horizonInfluence=exp(-horizonDistance*13.0);

  // ------------------------------------------------
  // ANIMATED 3D NOISE DISPLACEMENT
  // ------------------------------------------------

  // Noise changes the geometry, not the pixel colour.
  vec3 noisePosition=vec3(
    p.x*3.2,
    p.y*4.2,
    t*0.10
  );

  float broadNoise=fbm(noisePosition);

  float mediumNoise=fbm(
    noisePosition*3.0+vec3(4.0,8.0,t*0.18)
  );

  float fineNoise=fbm(
    noisePosition*9.0+vec3(12.0,3.0,t*0.3)
  );

  float surfaceNoise =
      (broadNoise-0.5)*0.17
    + (mediumNoise-0.5)*0.065
    + (fineNoise-0.5)*0.018;

  // More deformation near the horizon.
  float horizonNoise=fbm(
    vec3(p.x*13.0,p.y*28.0,t*0.5)
  );

  surfaceNoise +=
    (horizonNoise-0.5)*0.09*horizonInfluence;

  // ------------------------------------------------
  // LFO MODULATION
  // ------------------------------------------------

  float xControl=(mouse.x-0.5)*2.0;
  float yControl=(mouse.y-0.5)*2.0;

  float slowLFO=sin(t*0.11+xControl*2.0);
  float mediumLFO=sin(t*0.37-xControl*3.0+1.3);
  float fastLFO=sin(t*1.3+xControl*5.0);
  float microLFO=sin(t*4.0-xControl*7.0);

  float modulation =
      slowLFO*0.025
    + mediumLFO*0.012
    + fastLFO*0.004
    + microLFO*0.0015;

  // Mouse changes the actual geometry.
  float mouseDeformation =
    sin(p.y*8.0+t*0.3+xControl*3.0)*0.025
    + sin(p.x*11.0-t*0.2+yControl*2.0)*0.018;

  // ------------------------------------------------
  // CLICK EVENTS: GEOMETRY IMPULSES
  // ------------------------------------------------

  float clickHeight=0.0;

  for(int i=0;i<4;i++) {
    vec4 e=clickEvents[i];

    float age=e.z;
    float active=e.w;

    if(active>0.0 && age>=0.0 && age<4.5) {
      vec2 origin=e.xy-0.5;
      origin.x*=resolution.x/resolution.y;

      vec2 delta=p-origin;
      float d=length(delta);

      float fade=exp(-age*0.9);

      // A travelling displacement through the existing surface.
      float wave=sin(d*42.0-age*13.0);

      float envelope=exp(
        -pow((d-age*0.28)*3.0,2.0)
      );

      clickHeight +=
        wave*envelope*fade*0.11*active;
    }
  }

  // ------------------------------------------------
  // FINAL DISPLACED SURFACE
  // ------------------------------------------------

  height += surfaceNoise;
  height += modulation;
  height += mouseDeformation;
  height += clickHeight;

  // Horizon deformation.
  height +=
    sin(p.x*38.0+t*1.1)*
    horizonInfluence*0.025;

  // The dome and noise produce a single 3D fabric.
  // The mesh lines follow its displaced geometry.

  vec3 worldPosition=vec3(p.x,p.y+height*0.55,height);

  // Perspective-like projection.
  float cameraDepth=2.6-worldPosition.z*0.45;

  vec2 projected=worldPosition.xy/cameraDepth;

  float aspect=resolution.x/resolution.y;

  projected.x/=aspect;
  projected*=1.75;

  gl_Position=vec4(projected,0.0,1.0);

  surfaceDepth=height;
}
`;

// --------------------------------------------------
// FRAGMENT SHADER
// --------------------------------------------------

const fragmentSource = `
precision highp float;

varying float surfaceDepth;

void main() {
  // One white mesh line system.
  // No dots, grain, particles or background noise.

  gl_FragColor=vec4(1.0,1.0,1.0,1.0);
}
`;

function compileShader(type,source) {
  const shader=gl.createShader(type);
  gl.shaderSource(shader,source);
  gl.compileShader(shader);

  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(shader));
    return null;
  }

  return shader;
}

const vs=compileShader(gl.VERTEX_SHADER,vertexSource);
const fs=compileShader(gl.FRAGMENT_SHADER,fragmentSource);

if(!vs||!fs)return;

const program=gl.createProgram();
gl.attachShader(program,vs);
gl.attachShader(program,fs);
gl.linkProgram(program);

if(!gl.getProgramParameter(program,gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
  return;
}

gl.useProgram(program);

// --------------------------------------------------
// GPU BUFFERS
// --------------------------------------------------

const positionBuffer=gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);
gl.bufferData(
  gl.ARRAY_BUFFER,
  positions.byteLength,
  gl.DYNAMIC_DRAW
);

const gridLocation=gl.getAttribLocation(program,"gridPosition");

gl.enableVertexAttribArray(gridLocation);
gl.vertexAttribPointer(
  gridLocation,2,gl.FLOAT,false,0,0
);

const indexBuffer=gl.createBuffer();
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,indexBuffer);
gl.bufferData(
  gl.ELEMENT_ARRAY_BUFFER,
  indices,
  gl.STATIC_DRAW
);

const U=name=>gl.getUniformLocation(program,name);

const uResolution=U("resolution");
const uTime=U("time");
const uMouse=U("mouse");
const uEvents=U("clickEvents[0]");

// --------------------------------------------------
// ADAPTIVE MESH DENSITY
// --------------------------------------------------

// The mesh remains connected, but its vertices are
// concentrated around the cursor.
//
// This increases actual geometric resolution locally.

function adaptiveCoordinate(q,center,strength) {
  const k=strength;

  const low=Math.tanh(k*(-1.0-center));
  const high=Math.tanh(k*(1.0-center));
  const value=Math.tanh(k*(q-center));

  return 2.0*(value-low)/(high-low)-1.0;
}

let mouse={x:0.5,y:0.5};
let targetMouse={x:0.5,y:0.5};

function updateMesh() {
  const centerX=(mouse.x-0.5)*2.0;
  const centerY=(0.5-mouse.y)*2.0;

  // Higher strength means more concentrated vertices.
  const concentration=3.0;

  let index=0;

  for(let y=0;y<=ROWS;y++) {
    const qy=(y/ROWS)*2.0-1.0;

    const py=adaptiveCoordinate(
      qy,centerY,concentration
    );

    for(let x=0;x<=COLS;x++) {
      const qx=(x/COLS)*2.0-1.0;

      const px=adaptiveCoordinate(
        qx,centerX,concentration
      );

      positions[index++]=px;
      positions[index++]=py;
    }
  }

  gl.bindBuffer(gl.ARRAY_BUFFER,positionBuffer);
  gl.bufferSubData(gl.ARRAY_BUFFER,0,positions);
}

// --------------------------------------------------
// RESOLUTION
// --------------------------------------------------

function resize() {
  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);

  gl.viewport(0,0,canvas.width,canvas.height);

  gl.uniform2f(
    uResolution,canvas.width,canvas.height
  );
}

addEventListener("resize",resize);
resize();

addEventListener("pointermove",e=>{
  targetMouse.x=e.clientX/innerWidth;
  targetMouse.y=e.clientY/innerHeight;
});

// --------------------------------------------------
// AUDIO: INDUSTRIAL IDM / EBM
// --------------------------------------------------

let audioContext=null;
let master=null;
let audioStarted=false;

function makeNoise(ctx) {
  const length=ctx.sampleRate*5;
  const buffer=ctx.createBuffer(1,length,ctx.sampleRate);
  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++) {
    data[i]=Math.random()*2-1;
  }

  return buffer;
}

function distortionCurve(amount) {
  const samples=44100;
  const curve=new Float32Array(samples);

  for(let i=0;i<samples;i++) {
    const x=i*2/samples-1;
    curve[i]=(1+amount)*x/(1+amount*Math.abs(x));
  }

  return curve;
}

function startAudio() {
  if(audioStarted)return;

  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;

  audioContext=new AC();

  if(audioContext.state==="suspended")audioContext.resume();

  const compressor=audioContext.createDynamicsCompressor();
  compressor.threshold.value=-18;
  compressor.knee.value=12;
  compressor.ratio.value=5;
  compressor.attack.value=0.008;
  compressor.release.value=0.25;

  master=audioContext.createGain();
  master.gain.value=0.8;
  master.connect(compressor);
  compressor.connect(audioContext.destination);

  const shaper=audioContext.createWaveShaper();
  shaper.curve=distortionCurve(5);
  shaper.oversample="4x";

  // Continuous E1 sub-bass.
  const bass=audioContext.createOscillator();
  const bassGain=audioContext.createGain();
  const bassFilter=audioContext.createBiquadFilter();

  bass.type="sine";
  bass.frequency.value=41.203;
  bassGain.gain.value=0.105;

  bassFilter.type="lowpass";
  bassFilter.frequency.value=160;

  bass.connect(bassFilter);
  bassFilter.connect(bassGain);
  bassGain.connect(shaper);
  shaper.connect(master);

  // Harmonic bass layer.
  const harmonic=audioContext.createOscillator();
  const harmonicGain=audioContext.createGain();

  harmonic.type="triangle";
  harmonic.frequency.value=82.406;
  harmonicGain.gain.value=0.018;

  harmonic.connect(harmonicGain);
  harmonicGain.connect(shaper);

  // Bass LFO.
  const bassLFO=audioContext.createOscillator();
  const bassLFOGain=audioContext.createGain();

  bassLFO.frequency.value=0.075;
  bassLFOGain.gain.value=0.035;
  bassLFO.connect(bassLFOGain);
  bassLFOGain.connect(bassGain.gain);

  // Filter modulation.
  const filterLFO=audioContext.createOscillator();
  const filterLFOGain=audioContext.createGain();

  filterLFO.frequency.value=0.13;
  filterLFOGain.gain.value=75;
  filterLFO.connect(filterLFOGain);
  filterLFOGain.connect(bassFilter.frequency);

  // Industrial noise layer.
  const noise=audioContext.createBufferSource();
  noise.buffer=makeNoise(audioContext);
  noise.loop=true;

  const noiseFilter=audioContext.createBiquadFilter();
  noiseFilter.type="bandpass";
  noiseFilter.frequency.value=420;
  noiseFilter.Q.value=0.55;

  const noiseGain=audioContext.createGain();
  noiseGain.gain.value=0.045;

  const noisePan=audioContext.createStereoPanner();

  const noiseLFO=audioContext.createOscillator();
  const noiseLFOGain=audioContext.createGain();

  noiseLFO.frequency.value=0.09;
  noiseLFOGain.gain.value=280;

  noiseLFO.connect(noiseLFOGain);
  noiseLFOGain.connect(noiseFilter.frequency);

  const panLFO=audioContext.createOscillator();
  const panGain=audioContext.createGain();

  panLFO.frequency.value=0.065;
  panGain.gain.value=0.7;

  panLFO.connect(panGain);
  panGain.connect(noisePan.pan);

  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(noisePan);
  noisePan.connect(master);

  // High noise texture.
  const highNoise=audioContext.createBufferSource();
  highNoise.buffer=makeNoise(audioContext);
  highNoise.loop=true;

  const highFilter=audioContext.createBiquadFilter();
  highFilter.type="highpass";
  highFilter.frequency.value=1800;

  const highGain=audioContext.createGain();
  highGain.gain.value=0.009;

  highNoise.connect(highFilter);
  highFilter.connect(highGain);
  highGain.connect(master);

  bass.start();
  harmonic.start();
  bassLFO.start();
  filterLFO.start();
  noise.start();
  noiseLFO.start();
  panLFO.start();
  highNoise.start();

  audioStarted=true;
}

// Deep descending sweep.
function playSweep(x) {
  if(!audioContext||!master)return;

  const now=audioContext.currentTime;

  const osc=audioContext.createOscillator();
  const sub=audioContext.createOscillator();

  const gain=audioContext.createGain();
  const subGain=audioContext.createGain();

  const filter=audioContext.createBiquadFilter();
  const pan=audioContext.createStereoPanner();

  osc.type="triangle";
  osc.frequency.setValueAtTime(145,now);
  osc.frequency.exponentialRampToValueAtTime(31,now+2.7);

  sub.type="sine";
  sub.frequency.setValueAtTime(72,now);
  sub.frequency.exponentialRampToValueAtTime(25,now+3.0);

  filter.type="lowpass";
  filter.frequency.setValueAtTime(650,now);
  filter.frequency.exponentialRampToValueAtTime(90,now+2.8);
  filter.Q.value=2.2;

  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.23,now+0.08);
  gain.gain.setValueAtTime(0.16,now+0.5);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+4.0);

  subGain.gain.setValueAtTime(0.0001,now);
  subGain.gain.exponentialRampToValueAtTime(0.12,now+0.15);
  subGain.gain.exponentialRampToValueAtTime(0.0001,now+3.8);

  pan.pan.value=(x-0.5)*1.5;

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(pan);
  pan.connect(master);

  sub.connect(subGain);
  subGain.connect(pan);

  osc.start(now);
  sub.start(now);
  osc.stop(now+4.05);
  sub.stop(now+3.85);
}

// --------------------------------------------------
// CLICK: DISPLACE EXISTING GEOMETRY
// --------------------------------------------------

const clickEvents=[];

addEventListener("pointerdown",e=>{
  startAudio();

  const x=e.clientX/innerWidth;
  const y=1-e.clientY/innerHeight;

  const elapsed=(performance.now()-startTime)*0.001;

  clickEvents.push({x,y,time:elapsed});

  while(clickEvents.length>4)clickEvents.shift();

  playSweep(x);
});

// --------------------------------------------------
// ANIMATION
// --------------------------------------------------

const startTime=performance.now();

function render(now) {
  const t=(now-startTime)*0.001;

  mouse.x+=(targetMouse.x-mouse.x)*0.045;
  mouse.y+=(targetMouse.y-mouse.y)*0.045;

  updateMesh();

  gl.uniform1f(uTime,t);
  gl.uniform2f(uMouse,mouse.x,mouse.y);

  const eventData=new Float32Array(16);

  for(let i=0;i<4;i++) {
    if(i<clickEvents.length) {
      const e=clickEvents[i];
      const age=t-e.time;

      eventData[i*4]=e.x;
      eventData[i*4+1]=e.y;
      eventData[i*4+2]=age;
      eventData[i*4+3]=age>=0&&age<4.5?1:0;
    }
  }

  gl.uniform4fv(uEvents,eventData);

  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  gl.disable(gl.DEPTH_TEST);
  gl.lineWidth(1.0);

  gl.drawElements(
    gl.LINES,
    indices.length,
    gl.UNSIGNED_INT,
    0
  );

  requestAnimationFrame(render);
}

requestAnimationFrame(render);

})();
</script>
</body>
</html>
